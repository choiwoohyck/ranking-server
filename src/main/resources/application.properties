spring.application.name=ranking-server
spring.datasource.url=jdbc:mysql://localhost:3307/ranking
spring.datasource.username=root
spring.datasource.password=ranking
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
jwt.secret=local-dev-only-secret-change-me-0123456789
jwt.expiration-seconds=3600
# Swagger: GlobalExceptionHandler의 응답(400/401/409)을 모든 API에 자동으로 붙이지 않음
springdoc.override-with-generic-response=false