spring.application.name=ranking-server
# ${KEY:기본값} = 환경변수 KEY가 있으면 그 값, 없으면 기본값(로컬 개발용). Docker/EC2에서는 .env로 진짜 값을 넣는다.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/ranking}
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:ranking}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-0123456789}
jwt.expiration-seconds=3600
# Swagger: GlobalExceptionHandler의 응답(400/401/409)을 모든 API에 자동으로 붙이지 않음
springdoc.override-with-generic-response=false